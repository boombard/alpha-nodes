[project]
name = "alpha-nodes-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/lensgraph-ui"]  # the Node UI package, not a Python member

[tool.uv.sources]
lensgraph = { workspace = true }
alpha-nodes = { workspace = true }

[dependency-groups]
dev = ["lensgraph", "alpha-nodes", "pytest>=8", "pytest-asyncio", "ruff", "pyright"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/lensgraph/tests", "packages/alpha_nodes/tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"
