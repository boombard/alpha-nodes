[project]
name = "lensgraph"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14",
    "pandas>=3.1",
    "pandera[pandas]>=0.36",
    "numpy",
    "pyarrow",
    "fsspec",
    "duckdb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lensgraph"]
