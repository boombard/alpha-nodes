[project]
name = "alpha-nodes"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lensgraph",
    "exchange_calendars>=4.11",
    "yfinance[repair]==1.8.0",
    "curl_cffi==0.17.0",
]

[tool.uv.sources]
lensgraph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_nodes"]
