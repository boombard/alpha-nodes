project_name: "alpha-nodes"
default_status: "To Do"
statuses: ["To Do", "In Progress", "In Review", "Done"]
labels: ["core", "finance", "contracts", "sketch", "plan"]
date_format: "yyyy-mm-dd"
max_column_width: 20
default_editor: 'vi'
auto_open_browser: false
default_port: 6420
browser_hostname: "127.0.0.1"
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["`uv run pytest` passes (whole workspace)", "`uv run ruff check` and `uv run pyright` are clean", "New tests are pytest functions/fixtures; no network or real LLM calls", "documentation/design updated in the same change if behaviour differs from it"]
